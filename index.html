<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f6f7f9;
        color: #111;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        font-size: 22px;
        margin: 0;
      }

      .status {
        font-size: 12px;
        color: #555;
        white-space: nowrap;
      }

      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .mb10 {
        margin-bottom: 10px;
      }

      .mt6 {
        margin-top: 6px;
      }

      label {
        font-size: 13px;
        color: #333;
      }

      input[type="password"],
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      .grow {
        flex: 1 1 auto;
        min-width: 220px;
      }

      button {
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
      }

      button.primary {
        background: #111827;
        color: #fff;
        border-color: #111827;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .error {
        color: #b91c1c;
        font-size: 13px;
        margin-top: 10px;
      }

      ul.notes {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .note {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px;
        background: #fff;
      }

      .note pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.35;
      }

      .note-meta {
        font-size: 11px;
        color: #6b7280;
        margin-top: 6px;
      }

      .note-actions {
        flex: 0 0 auto;
      }

      .hidden {
        display: none;
      }

      .small {
        font-size: 12px;
        color: #555;
      }

      a {
        color: #2563eb;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Notes</h1>
        <div class="status" id="status"></div>
      </header>

      <div class="card" id="setupCard">
        <div class="row mb10">
          <div class="grow">
            <label for="tokenInput">GitHub token (scope: gist)</label>
            <input
              type="password"
              id="tokenInput"
              autocomplete="off"
              placeholder="ghp_... or github_pat_..."
            />
            <div class="small mt6">
              Create one at
              <a href="https://github.com/settings/tokens" target="_blank" rel="noopener noreferrer">https://github.com/settings/tokens</a>
            </div>
          </div>
          <div>
            <button type="button" id="saveTokenBtn" class="primary">Save token</button>
          </div>
          <div>
            <button type="button" id="clearTokenBtn">Clear token</button>
          </div>
        </div>

        <div class="row">
          <div class="grow">
            <label for="gistIdInput">Notes Gist ID</label>
            <input type="text" id="gistIdInput" placeholder="(optional) existing gist id" />
            <div class="small mt6">
              Leave blank and click "Create notes gist" to make a new one.
            </div>
          </div>
          <div>
            <button type="button" id="useGistBtn" class="primary">Use gist id</button>
          </div>
          <div>
            <button type="button" id="createGistBtn" class="primary">Create notes gist</button>
          </div>
        </div>

        <div class="error hidden" id="setupError"></div>
      </div>

      <div class="card hidden" id="notesCard">
        <div class="row mb10">
          <div class="grow">
            <label for="noteText">New note</label>
            <textarea id="noteText" placeholder="Type a note..."></textarea>
          </div>
          <div>
            <button type="button" id="addNoteBtn" class="primary" disabled>Add note</button>
          </div>
        </div>

        <ul class="notes" id="notesList"></ul>
        <div class="error hidden" id="notesError"></div>
      </div>
    </div>

    <script>
      "use strict";

      const STORAGE_TOKEN_KEY = "GITHUB_TOKEN";
      const STORAGE_GIST_ID_KEY = "NOTES_GIST_ID";
      const NOTES_FILENAME = "notes.json";
      const NOTES_SCHEMA_VERSION = 1;

      function el(id) {
        const element = document.getElementById(id);
        if (!element) {
          throw new Error("Missing element: " + id);
        }
        return element;
      }

      function setHidden(element, hidden) {
        element.classList.toggle("hidden", hidden);
      }

      function setText(element, value) {
        element.textContent = value;
      }

      function setError(targetId, message) {
        const target = el(targetId);
        setText(target, message || "");
        setHidden(target, !message);
      }

      function getToken() {
        return localStorage.getItem(STORAGE_TOKEN_KEY);
      }

      function setToken(token) {
        localStorage.setItem(STORAGE_TOKEN_KEY, token);
      }

      function clearToken() {
        localStorage.removeItem(STORAGE_TOKEN_KEY);
      }

      function getGistId() {
        return localStorage.getItem(STORAGE_GIST_ID_KEY);
      }

      function setGistId(gistId) {
        localStorage.setItem(STORAGE_GIST_ID_KEY, gistId);
      }

      function clearGistId() {
        localStorage.removeItem(STORAGE_GIST_ID_KEY);
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function createNote(text) {
        return {
          id: String(Date.now()),
          createdAt: nowIso(),
          text,
        };
      }

      function normalizeNotesDocument(doc) {
        if (!doc || typeof doc !== "object") {
          return { version: NOTES_SCHEMA_VERSION, notes: [] };
        }

        // Undefined version: hypothetical previous schema (did not exist in practice).
        // Shown here to illustrate how migration would work if the schema changed.
        // This version would have stored notes as "items" with "content" and "timestamp".
        if (doc.version === undefined) {
          const oldItems = Array.isArray(doc.items) ? doc.items : [];
          const migratedNotes = oldItems.map((item) => ({
            id: item.id || String(Date.now()),
            createdAt: item.timestamp || nowIso(),
            text: item.content || "",
          }));
          return { version: 1, notes: migratedNotes };
        }

        if (doc.version === 1) {
          const notes = Array.isArray(doc.notes) ? doc.notes : [];
          return { version: 1, notes };
        }

        throw new Error("Unknown notes schema version: " + doc.version);
      }

      async function githubRequest(path, options) {
        const token = getToken();
        if (!token) {
          throw new Error("Missing GitHub token");
        }

        const response = await fetch("https://api.github.com" + path, {
          ...options,
          headers: {
            "Authorization": "token " + token,
            "Accept": "application/vnd.github+json",
            ...(options && options.headers ? options.headers : {}),
          },
        });

        if (response.status === 401 || response.status === 403) {
          clearToken();
          throw new Error("GitHub authentication failed (token cleared)");
        }

        if (!response.ok) {
          const responseText = await response.text();
          throw new Error("GitHub API error " + response.status + ": " + responseText);
        }

        return response;
      }

      async function readNotesFromGist(gistId) {
        const response = await githubRequest("/gists/" + encodeURIComponent(gistId), {
          method: "GET",
        });

        const gist = await response.json();
        const files = gist && gist.files ? gist.files : null;
        if (!files || !files[NOTES_FILENAME] || typeof files[NOTES_FILENAME].content !== "string") {
          throw new Error("Gist does not contain " + NOTES_FILENAME);
        }

        let parsed;
        try {
          parsed = JSON.parse(files[NOTES_FILENAME].content);
        } catch (err) {
          throw new Error("Invalid JSON in " + NOTES_FILENAME);
        }

        return normalizeNotesDocument(parsed);
      }

      async function writeNotesToGist(gistId, notesDocument) {
        await githubRequest("/gists/" + encodeURIComponent(gistId), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            files: {
              [NOTES_FILENAME]: {
                content: JSON.stringify(notesDocument, null, 2),
              },
            },
          }),
        });
      }

      async function createNotesGist() {
        // navigator.webdriver is set to true by the browser when controlled via WebDriver
        // protocol (Puppeteer, Selenium, Playwright). The browser sets this flag at launch
        // based on automation flags like --remote-debugging-port. It's not spoofable from
        // JavaScript... except it is: puppeteer-extra-plugin-stealth or evaluateOnNewDocument
        // can override it. Real bot protection uses many signals beyond this single flag.
        const initialDoc = {
          version: NOTES_SCHEMA_VERSION,
          createdBy: window.location.href,
          createdAt: nowIso(),
          automated: !!navigator.webdriver,
          notes: [],
        };
        const response = await githubRequest("/gists", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            description: "Notes app storage",
            public: false,
            files: {
              [NOTES_FILENAME]: {
                content: JSON.stringify(initialDoc, null, 2),
              },
            },
          }),
        });

        const data = await response.json();
        if (!data || !data.id) {
          throw new Error("Unexpected response creating gist");
        }
        return String(data.id);
      }

      function renderNotes(notesDocument) {
        const list = el("notesList");
        list.innerHTML = "";

        const notes = notesDocument.notes.slice().sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
        for (const note of notes) {
          const li = document.createElement("li");
          li.className = "note";

          const left = document.createElement("div");
          const pre = document.createElement("pre");
          pre.textContent = String(note.text || "");
          left.appendChild(pre);

          const meta = document.createElement("div");
          meta.className = "note-meta";
          meta.textContent = String(note.createdAt || "");
          left.appendChild(meta);

          const actions = document.createElement("div");
          actions.className = "note-actions";

          const del = document.createElement("button");
          del.type = "button";
          del.textContent = "Delete";
          del.addEventListener("click", () => {
            void deleteNote(String(note.id));
          });

          actions.appendChild(del);

          li.appendChild(left);
          li.appendChild(actions);
          list.appendChild(li);
        }
      }

      let currentNotes = { version: NOTES_SCHEMA_VERSION, notes: [] };
      let busy = false;

      function setBusy(value) {
        busy = value;
        el("saveTokenBtn").disabled = value;
        el("clearTokenBtn").disabled = value;
        el("useGistBtn").disabled = value;
        el("createGistBtn").disabled = value;
        el("addNoteBtn").disabled = value || el("noteText").value.trim().length === 0;
      }

      function updateStatus() {
        const hasToken = !!getToken();
        const gistId = getGistId();
        const statusParts = [];
        statusParts.push(hasToken ? "Token: set" : "Token: missing");
        statusParts.push(gistId ? "Gist: " + gistId : "Gist: missing");
        setText(el("status"), statusParts.join(" | "));
      }

      async function refreshNotes() {
        const gistId = getGistId();
        if (!gistId) {
          throw new Error("Missing gist id");
        }

        currentNotes = await readNotesFromGist(gistId);
        renderNotes(currentNotes);
      }

      async function addNote() {
        if (busy) {
          return;
        }
        setError("notesError", "");

        const text = el("noteText").value.trim();
        if (!text) {
          return;
        }

        const gistId = getGistId();
        if (!gistId) {
          setError("notesError", "Missing gist id");
          return;
        }

        try {
          setBusy(true);
          const newNote = createNote(text);
          const updated = {
            version: NOTES_SCHEMA_VERSION,
            notes: [newNote, ...currentNotes.notes],
          };
          await writeNotesToGist(gistId, updated);
          currentNotes = updated;
          el("noteText").value = "";
          renderNotes(currentNotes);
          updateStatus();
        } catch (err) {
          setError("notesError", String(err && err.message ? err.message : err));
          updateStatus();
        } finally {
          setBusy(false);
        }
      }

      async function deleteNote(noteId) {
        if (busy) {
          return;
        }
        setError("notesError", "");

        const gistId = getGistId();
        if (!gistId) {
          setError("notesError", "Missing gist id");
          return;
        }

        try {
          setBusy(true);
          const updatedNotes = currentNotes.notes.filter((note) => String(note.id) !== String(noteId));
          const updated = { version: NOTES_SCHEMA_VERSION, notes: updatedNotes };
          await writeNotesToGist(gistId, updated);
          currentNotes = updated;
          renderNotes(currentNotes);
          updateStatus();
        } catch (err) {
          setError("notesError", String(err && err.message ? err.message : err));
          updateStatus();
        } finally {
          setBusy(false);
        }
      }

      function updateUiVisibility() {
        const hasToken = !!getToken();
        const hasGist = !!getGistId();

        setHidden(el("setupCard"), false);
        setHidden(el("notesCard"), !(hasToken && hasGist));

        updateStatus();
      }

      async function useGistIdFromInput() {
        setError("setupError", "");
        const gistId = el("gistIdInput").value.trim();
        if (!gistId) {
          setError("setupError", "Enter a gist id or click Create notes gist");
          return;
        }

        setGistId(gistId);
        updateUiVisibility();

        try {
          setBusy(true);
          await refreshNotes();
        } catch (err) {
          clearGistId();
          updateUiVisibility();
          setError("setupError", String(err && err.message ? err.message : err));
        } finally {
          setBusy(false);
        }
      }

      async function createAndUseGist() {
        setError("setupError", "");
        try {
          setBusy(true);
          const gistId = await createNotesGist();
          setGistId(gistId);
          updateUiVisibility();
          await refreshNotes();
        } catch (err) {
          setError("setupError", String(err && err.message ? err.message : err));
          updateUiVisibility();
        } finally {
          setBusy(false);
        }
      }

      function wireEvents() {
        el("saveTokenBtn").addEventListener("click", () => {
          setError("setupError", "");
          const token = el("tokenInput").value.trim();
          if (!token) {
            setError("setupError", "Enter a token");
            return;
          }
          setToken(token);
          el("tokenInput").value = "";
          updateUiVisibility();
        });

        el("clearTokenBtn").addEventListener("click", () => {
          clearToken();
          clearGistId();
          currentNotes = { version: NOTES_SCHEMA_VERSION, notes: [] };
          renderNotes(currentNotes);
          updateUiVisibility();
        });

        el("useGistBtn").addEventListener("click", () => {
          void useGistIdFromInput();
        });

        el("createGistBtn").addEventListener("click", () => {
          void createAndUseGist();
        });

        el("noteText").addEventListener("input", () => {
          el("addNoteBtn").disabled = busy || el("noteText").value.trim().length === 0;
        });

        el("addNoteBtn").addEventListener("click", () => {
          void addNote();
        });
      }

      async function init() {
        wireEvents();
        updateUiVisibility();

        const hasToken = !!getToken();
        const gistId = getGistId();
        if (hasToken && gistId) {
          try {
            setBusy(true);
            await refreshNotes();
          } catch (err) {
            setError("setupError", String(err && err.message ? err.message : err));
            setHidden(el("notesCard"), true);
          } finally {
            setBusy(false);
            updateUiVisibility();
          }
        }
      }

      void init();
    </script>
  </body>
</html>
